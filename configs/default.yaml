# Probability_Model default config
# Bars are always 1m. Symbol is a run parameter (research default: ES).

symbol: ES
timeframe: "1m"
data_path: null

# Fixed horizon for ATR barrier touch probabilities (1m bars)
horizons: [30]

# Primary: first barrier within n — P(up first) / P(down first) / P(none)
# Path high/low; same-bar double hit → none. Not a trade strategy.
target_id: atr_barrier_first
target:
  horizon: 30
  atr_period: 14
  barrier_tau: 2.0

# Default state = v1 (A–E, 30) + alphabet wave-1 (13) = 43
state_ids:
  # A — price movement / ATR14
  - ret_atr_1
  - ret_atr_3
  - ret_atr_5
  - ret_atr_15
  - ret_atr_30
  - ret_atr_60
  # B — volatility
  - atr_14
  - atr_60
  - atr_240
  - atr_ratio_14_60
  - atr_ratio_60_240
  - rv_14
  - rv_60
  # C — candle structure
  - body_atr
  - upper_wick_atr
  - lower_wick_atr
  - range_atr
  - close_pos
  - dir_consist_15
  # D — trend
  - dist_ema_10
  - dist_ema_30
  - dist_ema_60
  - ema_slope_10   # lag=5
  - ema_slope_60   # lag=15
  - eff_30
  # E — volume (relative only)
  - rvol_5
  - rvol_30
  - vol_z_60
  - vol_chg
  - vol_x_ret
  # F — alphabet wave-1 (Quanqora Core A subset; Warsaw session canon)
  - vwap_dist
  - session_range_pos
  - dist_session_extreme_atr
  - gap_atr
  - mins_in_session
  - mins_to_session_end
  - session_vol_frac
  - gk_rv_ratio
  - range_compression
  - vol_pct
  - ret_skew
  - ret_accel
  - sma_open_approach

holdout_frac: 0.2
# Drop train rows within this many bars of the holdout edge (label overlap).
purge: 30

# v1 backend = HistGradientBoosting; lgbm deferred to server.
model:
  backend: hgb
  class_weight: balanced
  max_depth: 6
  learning_rate: 0.05
  max_iter: 200
  l2_regularization: 1.0
  min_samples_leaf: 40
  random_state: 0

artifacts_dir: artifacts/run

# Local Databento/Quanqora export (gitignored). Example:
# data_path: data/ES_1m.csv
