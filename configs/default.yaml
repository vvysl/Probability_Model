# Probability_Model default config
# Bars are always 1m. Symbol is a run parameter (research default: ES).

symbol: ES
timeframe: "1m"
data_path: null

# Horizons in 1m bars (step 2)
horizons: [3, 10, 30]

# Ternary displacement: sign of (close_{t+h}-close_t)/ATR_t vs flat_tau
target_id: ternary_displacement
target:
  atr_period: 14
  flat_tau: 0.15

# Step 3: continuous state variable ids from pm.state.registry
state_ids: []

holdout_frac: 0.2
