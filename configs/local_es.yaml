- ret_atr_5
- ret_atr_15
- ret_atr_30
- ret_atr_60
- atr_14
- atr_60
- atr_240
- atr_ratio_14_60
- atr_ratio_60_240
- rv_14
- rv_60
- body_atr
- upper_wick_atr
- lower_wick_atr
- range_atr
- close_pos
- dir_consist_15
- dist_ema_10
- dist_ema_30
- dist_ema_60
- ema_slope_10
- ema_slope_60
- eff_30
- rvol_5
- rvol_30
- vol_z_60
- vol_chg
- vol_x_ret
holdout_frac: 0.2
purge: 30
